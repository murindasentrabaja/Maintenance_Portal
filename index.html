<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSB Maintenance Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:#1e293b;background:linear-gradient(135deg,#e0f2fe,#ede9fe 50%,#fce7f3) fixed;min-height:100vh}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:rgba(255,255,255,.65);backdrop-filter:blur(16px);border-bottom:1px solid #fff}
header b{font-size:18px;color:#4338ca}header a{color:inherit;text-decoration:none}.sp{flex:1}
main{max-width:1000px;margin:20px auto;padding:0 16px}
.card,.tile,dialog{background:rgba(255,255,255,.7);backdrop-filter:blur(14px);border:1px solid #fff;border-radius:18px;box-shadow:0 8px 30px rgba(99,102,241,.12);padding:20px;margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tile{text-decoration:none;color:inherit;transition:.2s;margin:0}.tile:hover{transform:translateY(-4px)}.tile i{font-size:28px;color:#6366f1}.tile h3{margin:10px 0 4px}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:flex;flex-direction:column;font-size:13px;font-weight:600;gap:4px}label.w,form .row,form>h3,form>p,form>.btn{grid-column:1/-1}
input,select,textarea{padding:10px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:#fff}input[readonly]{background:#f1f5f9}
.btn{display:inline-block;padding:11px 20px;border:0;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}.btn.g{background:#e2e8f0;color:#334155}
.mut{color:#64748b;font-size:13px}.no{font-size:26px;font-weight:700;color:#4338ca;margin:8px 0}.ok{border-left:6px solid #22c55e}
.bd{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#e0e7ff;color:#3730a3}.bd.Selesai{background:#dcfce7;color:#166534}.bd.Ditolak{background:#fee2e2;color:#991b1b}
.st{display:flex;gap:4px;margin:12px 0;flex-wrap:wrap}.st span{flex:1;min-width:70px;text-align:center;font-size:11px;padding:6px 2px;border-radius:8px;background:#e2e8f0;color:#64748b}.st span.d{background:#6366f1;color:#fff}
.lg{font-size:12px;color:#475569;border-left:2px solid #c7d2fe;margin:8px 0 0 6px;padding-left:10px}.lg div{margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;text-align:left;border-bottom:1px solid #e2e8f0}.sc{overflow-x:auto}
dialog{max-width:620px;width:94%}dialog::backdrop{background:rgba(15,23,42,.4)}.row{display:flex;gap:10px}
@media(max-width:600px){form{grid-template-columns:1fr}}
</style><link rel=icon href="MSB_Logo.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel=stylesheet><style>
:root{--p:#4f46e5;--p2:#7c3aed;--ink:#0f172a;--mut:#64748b}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(900px 500px at 8% -10%,#c7d2fe88,transparent),radial-gradient(800px 500px at 100% 0,#fbcfe888,transparent),radial-gradient(700px 500px at 50% 110%,#bae6fd99,transparent),#f8fafc fixed}
header{padding:10px 24px;gap:18px;background:rgba(255,255,255,.75);box-shadow:0 4px 24px rgba(15,23,42,.06)}
.brand{display:flex;align-items:center;gap:12px}.brand img{height:34px}.brand span{display:flex;flex-direction:column;border-left:2px solid #e2e8f0;padding-left:12px;line-height:1.2}.brand b{font-size:15px;color:var(--ink)}.brand small{font-size:11px;color:var(--mut)}
nav{display:flex;gap:4px}nav a{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;color:#475569}nav a:hover{background:#eef2ff;color:var(--p)}
main{animation:up .45s ease}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card,.tile,dialog{border-radius:22px;background:rgba(255,255,255,.8);box-shadow:0 10px 40px rgba(79,70,229,.08)}
.hero{border-radius:26px;padding:34px;margin-bottom:22px;color:#fff;background:linear-gradient(120deg,#1e40af,#4f46e5 55%,#7c3aed);box-shadow:0 20px 50px rgba(79,70,229,.3);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.88;max-width:560px}
.tile{padding:22px}.tile:hover{transform:translateY(-6px);box-shadow:0 20px 50px rgba(79,70,229,.2)}
.tile>i{width:52px;height:52px;display:grid;place-items:center;font-size:22px;color:#fff;border-radius:16px;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 8px 20px rgba(79,70,229,.35)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px #4f46e51f}
.btn{box-shadow:0 6px 16px rgba(79,70,229,.3);transition:.2s}.btn:hover{transform:translateY(-2px)}.btn.g{box-shadow:none}.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.bd{background:#dbeafe;color:#1d4ed8}.bd.Diterima,.bd.Direview{background:#e0e7ff;color:#4338ca}.bd.Dijadwalkan{background:#ede9fe;color:#6d28d9}.bd.Diproses{background:#fef3c7;color:#b45309}.bd.Menunggu{background:#ffedd5;color:#c2410c}.bd.Disetujui,.bd.Pengadaan{background:#ccfbf1;color:#0f766e}.bd.Selesai{background:#dcfce7;color:#166534}.bd.Ditolak{background:#fee2e2;color:#991b1b}
.ac{display:flex;gap:8px;align-items:center}.nw{white-space:nowrap}.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.st span{border-radius:99px}.st span.d{background:linear-gradient(135deg,var(--p),var(--p2))}
.lg{border-left:2px solid #c7d2fe;padding-left:16px;margin-left:8px}.lg div{position:relative}.lg div:before{content:"";position:absolute;left:-21px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--p)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}tr:hover td{background:#f5f3ff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.kp{background:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;box-shadow:0 6px 24px rgba(79,70,229,.08)}.kp i{color:var(--p);margin-bottom:6px}.kp b{font-size:26px}.kp span{font-size:12px;color:var(--mut)}
#pr{display:none}.nostaff a[href="#maintenance"]{display:none}.tabs{display:flex;gap:6px;background:#eef2ff;padding:5px;border-radius:14px;margin:12px 0}.tabs button{flex:1;border:0;padding:9px;border-radius:10px;background:transparent;font:inherit;font-weight:600;color:#475569;cursor:pointer}.tabs button.on{background:#fff;color:var(--p);box-shadow:0 2px 8px rgba(79,70,229,.15)}@media(max-width:700px){nav{display:none}.hero{padding:24px}}
@media print{@page{size:A4;margin:14mm}body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}body>*:not(#pr){display:none!important}#pr{display:block;font-size:12px;color:#111}
.ph{display:flex;align-items:center;gap:14px;border-bottom:3px solid #1e40af;padding-bottom:10px;margin-bottom:14px}.ph img{height:46px}.pt{flex:1;display:flex;flex-direction:column}.pt b{font-size:15px;color:#1e40af}.pr2{text-align:right;display:flex;flex-direction:column}.pr2 b{font-size:14px}
.pn{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px}.pk{width:100%;margin-bottom:10px}.pk th{width:32%;background:#f1f5f9;text-transform:none;letter-spacing:0;font-size:12px;color:#334155}.pk th,.pk td,.pt2 th,.pt2 td{border:1px solid #cbd5e1;padding:5px 7px}.pt2{width:100%}.pt2 td,.pt2 th{font-size:11px}
#pr h4{margin:14px 0 6px}#pr .kp{border:1px solid #cbd5e1;box-shadow:none}.sig{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px}.sig div{text-align:center}.sig i{display:block;height:64px;border-bottom:1px solid #111}}
</style></head><body><div id=pr></div>
<header><a href="#home" class=brand><img src="MSB_Logo.png" alt="PT Murinda Sentra Baja" onerror="this.style.display='none'"><span><b>Maintenance Portal</b><small>Layanan Perawatan Alat &amp; Mesin</small></span></a><nav><a href="#home">Beranda</a><a href="#pantau">Pantau</a><a href="#maintenance">Maintenance</a></nav><span class="sp"></span>
<span id="dep" class="mut"></span><button id="lo" class="btn g sm" onclick="logout()" style="display:none"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button></header>
<datalist id="dlk"></datalist><datalist id="dla"></datalist>
<main id="v"></main><dialog id="dlg"></dialog>
<script>
const API="https://script.google.com/macros/s/AKfycbywoBQoN6hQbdPH5O9MS5wUjNu2M8cx_klVwEXWhXyK42ArW66SkbqY2YpuTvoZL7U/exec";
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PR={t:'s',o:['Rendah','Sedang','Tinggi','Darurat'],r:1};
const FLOW={perbaikan:['Diajukan','Diterima','Dijadwalkan','Diproses','Menunggu Sparepart','Selesai'],kalibrasi:['Diajukan','Diterima','Dijadwalkan','Diproses','Selesai'],penambahan:['Diajukan','Direview','Disetujui','Pengadaan','Selesai']};
const AS=[{k:'Kode Aset',t:'aset',r:1,l:'Kode Aset (alat/mesin)'},{k:'Jenis Aset',ro:1},{k:'Nama Aset',ro:1},{k:'Lokasi'}];
const CT={k:'Catatan Maintenance',t:'ta',w:1};
const D={
perbaikan:{sheet:'Order Perbaikan',id:'No Order',t:'Order Perbaikan Alat & Mesin',ic:'fa-screwdriver-wrench',d:'Laporkan kerusakan alat/mesin untuk diperbaiki.',
 f:[...AS,{k:'Kondisi Aset',t:'s',r:1,o:['Masih Beroperasi (Terbatas)','Berhenti Total','Berbahaya - Jangan Dioperasikan']},{k:'Prioritas',...PR},{k:'Dampak ke Produksi',t:'s',o:['Tidak Ada','Mengganggu','Menghentikan Produksi']},{k:'Foto URL',l:'Link Foto/Video (opsional)'},{k:'Deskripsi Kerusakan',t:'ta',r:1,w:1}],
 staff:[{k:'Teknisi Ditugaskan'},{k:'Tanggal Jadwal',t:'date'},{k:'Tanggal Selesai',t:'date'},{k:'Tindakan Maintenance',t:'ta',w:1},CT]},
kalibrasi:{sheet:'Permintaan Kalibrasi',id:'No Permintaan',t:'Permintaan Kalibrasi Alat & Mesin',ic:'fa-gauge-high',d:'Ajukan kalibrasi alat ukur, mesin las, atau mesin produksi.',
 f:[...AS,{k:'Jenis Kalibrasi',t:'s',r:1,o:['Rutin/Periodik','Setelah Perbaikan','Sebelum Dipakai','Persiapan Audit']},{k:'Parameter Kalibrasi',r:1,l:'Parameter (arus, tegangan, tekanan, dimensi, dll)'},{k:'Standar/Acuan'},{k:'Tanggal Dibutuhkan',t:'date'},{k:'Prioritas',...PR},{k:'Alasan/Keterangan',t:'ta',w:1}],
 staff:[{k:'Teknisi/Vendor',l:'Teknisi / Vendor Kalibrasi'},{k:'Tanggal Jadwal',t:'date'},{k:'Tanggal Selesai',t:'date'},{k:'Hasil Kalibrasi',t:'s',o:['Lulus','Lulus dengan Catatan','Tidak Lulus']},{k:'Sertifikat URL'},CT]},
penambahan:{sheet:'Permintaan Penambahan',id:'No Permintaan',t:'Permintaan Penambahan Alat & Mesin',ic:'fa-circle-plus',d:'Usulkan pengadaan alat atau mesin baru.',
 f:[{k:'Jenis Permintaan',t:'s',r:1,o:['Alat','Mesin']},{k:'Nama Alat/Mesin Diminta',r:1},{k:'Spesifikasi/Kapasitas',t:'ta',r:1,w:1},{k:'Jumlah',t:'number',r:1},{k:'Lokasi Penempatan'},{k:'Tanggal Dibutuhkan',t:'date'},{k:'Estimasi Biaya (Rp)',t:'number'},{k:'Vendor Usulan'},{k:'Prioritas',...PR},{k:'Alasan Kebutuhan',t:'ta',r:1,w:1}],
 staff:[{k:'Disetujui Oleh'},{k:'Tanggal Selesai',t:'date'},CT]}};
let DB={aset:[]},AU=JSON.parse(sessionStorage.msbAu||'null'),ME=AU&&AU.Profil,STAFF=AU&&AU.Staff?{u:AU.Username,p:AU.p}:null,R=[],USERS=[],KAR=[],GT="pemohon";
const api=async b=>(await fetch(API,{method:'POST',body:JSON.stringify(b)})).json();
const get=async q=>(await fetch(API+'?'+new URLSearchParams(q))).json();
const loading=()=>$('#v').innerHTML='<p class=mut><i class="fa-solid fa-spinner fa-spin"></i> Memuat Data...</p>';
const need=()=>'<div class=card><h3>Pilih nama Anda dulu</h3><p>Ketik nama pada kolom di kanan atas agar permintaan tercatat atas nama dan departemen Anda.</p></div>';
const summ=o=>o['Nama Aset']||o['Nama Alat/Mesin Diminta']||'';
function who(){$('#dep').innerHTML=AU?`<i class="fa-solid fa-user"></i> ${esc(ME.Nama_Lengkap)}${ME.Departemen?' · '+esc(ME.Departemen):''}`:'';$('#lo').style.display=AU?'':'none';document.body.classList.toggle('nostaff',!STAFF)}
function logout(){sessionStorage.clear();AU=ME=STAFF=null;route()}
const aset=()=>$('#dla').innerHTML=DB.aset.map(x=>`<option value="${esc(x.Kode)}">${esc(x.Nama)}</option>`).join('');
async function gate(m,t){if(t)GT=t;loading();
 if(!USERS.length){try{USERS=(await get({action:'loginUsers'})).data||[]}catch(x){}}
 if(!KAR.length){try{KAR=(await get({action:'karyawanUsers'})).data||[]}catch(x){}}
 const P=GT=='pemohon',L=P?KAR.map(x=>[x.Nama_Lengkap,x.Nama_Lengkap+(x.Departemen?' — '+x.Departemen:'')]):USERS.map(x=>[x.Username,x.Username+(x.Role?' — '+x.Role:'')]);
 $('#v').innerHTML=`<div class=card style="max-width:440px;margin:40px auto"><div style="text-align:center"><img src="MSB_Logo.png" style="height:44px" alt="" onerror="this.style.display='none'"></div><h2 style="text-align:center;margin-bottom:0">Masuk ke Portal</h2><div class=tabs><button type=button class="${P?'on':''}" onclick="gate('','pemohon')"><i class="fa-solid fa-user"></i> Pemohon</button><button type=button class="${P?'':'on'}" onclick="gate('','maint')"><i class="fa-solid fa-screwdriver-wrench"></i> Maintenance</button></div><p class=mut style="text-align:center">${esc(m||(P?'Karyawan: pilih nama Anda lalu ketik password.':'Tim Maintenance: pilih akun lalu ketik password.'))}</p><form onsubmit="return doGate(event)" style="grid-template-columns:1fr"><label>${P?'Nama Karyawan':'Akun Maintenance'}<select name=u required><option value="">Pilih...</option>${L.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('')}</select></label><label>Password<input name=p type=password required autocomplete=current-password></label><button class=btn>Masuk</button></form>${L.length?'':'<p class=mut>Belum ada akun. Isi kolom Password di sheet terkait.</p>'}</div>`}
async function doGate(e){e.preventDefault();const f=e.target,b=f.querySelector('button.btn'),u=f.u.value,p=f.p.value,tipe=GT;b.disabled=true;b.textContent='Memeriksa...';
 try{const r=await api({action:'portalLogin',tipe,username:u,password:p});if(!r.ok)throw r.error;
 AU={...r.user,p,tipe};sessionStorage.msbAu=JSON.stringify(AU);ME=AU.Profil;STAFF=AU.Staff?{u:AU.Username,p}:null;DB.aset=r.aset;aset();route()}catch(x){gate(String(x))}return false}
function route(){who();if(!AU)return gate();const h=location.hash.slice(1)||'home';if(h=='home')home();else if(D[h])form(h);else if(h=='pantau')pantau();else if(h=='maintenance')staff()}
function home(){$('#v').innerHTML=`<div class=hero><h1>Halo${ME?', '+esc(ME.Nama_Lengkap.split(' ')[0]):''}</h1><p>Ajukan perbaikan, kalibrasi, atau penambahan alat &amp; mesin secara digital, lalu pantau prosesnya langsung.</p></div><h3>Pilih Layanan</h3><div class=tiles>`+Object.keys(D).map(k=>`<a class=tile href="#${k}"><i class="fa-solid ${D[k].ic}"></i><h3>${D[k].t}</h3><span class=mut>${D[k].d}</span></a>`).join('')+'<a class=tile href="#pantau"><i class="fa-solid fa-list-check"></i><h3>Pantau Permintaan Saya</h3><span class=mut>Lihat status & riwayat tindak lanjut.</span></a><a class=tile href="#maintenance"><i class="fa-solid fa-lock"></i><h3>Panel Maintenance</h3><span class=mut>Khusus tim Maintenance.</span></a></div>'}
function fld(x){const n=`name="${x.k}"`,r=x.r?'required':'';let i;
 if(x.t=='ta')i=`<textarea ${n} ${r} rows=3></textarea>`;
 else if(x.t=='s')i=`<select ${n} ${r}><option value="">Pilih...</option>${x.o.map(o=>`<option>${o}</option>`).join('')}</select>`;
 else if(x.t=='aset')i=`<input ${n} ${r} list=dla autocomplete=off onchange="pick(this)" placeholder="Ketik kode / nama">`;
 else i=`<input ${n} ${r} type="${x.t||'text'}" ${x.ro?'readonly':''}>`;
 return `<label class="${x.w?'w':''}">${x.l||x.k}${x.r?' *':''}${i}</label>`}
function pick(el){const a=DB.aset.find(x=>x.Kode==el.value),f=el.form;if(!a)return;f['Jenis Aset'].value=a.Jenis;f['Nama Aset'].value=a.Nama;f['Lokasi'].value=a.Lokasi}
function form(k){if(!ME)return $('#v').innerHTML=need();const d=D[k];
 $('#v').innerHTML=`<div class=card><h2><i class="fa-solid ${d.ic}"></i> ${d.t}</h2><p class=mut>Pemohon: <b>${esc(ME.Nama_Lengkap)}</b> · ${esc(ME.Departemen)}</p><form onsubmit="return send(event,'${k}')">${d.f.map(fld).join('')}<button class=btn>Kirim Permintaan</button></form></div>`}
async function send(e,k){e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='Mengirim...';
 const p=Object.fromEntries(new FormData(e.target));Object.assign(p,{Pemohon:ME.Nama_Lengkap,Jabatan:ME.Jabatan,Departemen:ME.Departemen});
 try{const r=await api({action:'submit',tipe:AU.tipe,username:AU.Username,password:AU.p,sheet:D[k].sheet,payload:p});if(!r.ok)throw r.error;
 $('#v').innerHTML=`<div class="card ok"><h2><i class="fa-solid fa-circle-check"></i> Permintaan Terkirim</h2><p>Nomor dokumen Anda:</p><div class=no>${esc(r.id)}</div><p class=mut>Tim Maintenance akan menindaklanjuti. Pantau statusnya kapan saja.</p><a class=btn href="#pantau">Pantau Permintaan Saya</a></div>`}
 catch(x){alert('Gagal mengirim: '+x);b.disabled=false;b.textContent='Kirim Permintaan'}return false}
function item(k,o,log){const d=D[k],F=FLOW[k],i=F.indexOf(o.Status),id=o[d.id];DOCS[id]={k,o,log};
 return `<div class=card><div class=row style="justify-content:space-between;flex-wrap:wrap"><b>${esc(id)} · ${d.t}</b><span class=ac><span class="bd ${o.Status}">${esc(o.Status)}</span><button class="btn g sm" onclick="cetakId('${esc(id)}')"><i class="fa-solid fa-print"></i> Cetak</button></span></div>
 <p>${esc(summ(o))} <span class=mut>· diajukan ${esc(o['Tanggal Diajukan'])} · prioritas ${esc(o.Prioritas)}</span></p>
 <div class=st>${F.map((s,j)=>`<span class="${j<=i&&o.Status!='Ditolak'?'d':''}">${s}</span>`).join('')}</div>
 ${o['Teknisi Ditugaskan']||o['Teknisi/Vendor']?`<p class=mut><i class="fa-solid fa-user-gear"></i> ${esc(o['Teknisi Ditugaskan']||o['Teknisi/Vendor'])}${o['Tanggal Jadwal']?' · jadwal '+esc(o['Tanggal Jadwal']):''}</p>`:''}
 ${o['Catatan Maintenance']?`<p><b>Catatan Maintenance:</b> ${esc(o['Catatan Maintenance'])}</p>`:''}
 <div class=lg>${log.filter(l=>l['No Dokumen']==id).map(l=>`<div>${esc(l.Waktu)} — <b>${esc(l['Status Baru'])}</b> oleh ${esc(l['Diubah Oleh'])}</div>`).join('')}</div></div>`}
async function pantau(){if(!ME)return $('#v').innerHTML=need();loading();
 try{const r=await api({action:'myRequests',tipe:AU.tipe,username:AU.Username,password:AU.p});if(!r.ok)throw r.error;const L=[];
 for(const k in D)(r.data[D[k].sheet]||[]).forEach(o=>L.push({k,o}));L.sort((a,b)=>String(b.o['Tanggal Diajukan']).localeCompare(String(a.o['Tanggal Diajukan'])));
 $('#v').innerHTML='<h2>Permintaan Saya</h2>'+(L.length?L.map(x=>item(x.k,x.o,r.log)).join(''):'<p class=mut>Belum ada permintaan.</p>')}
 catch(x){$('#v').innerHTML='<div class=card>Gagal memuat: '+esc(x)+'</div>'}}
async function staff(){if(!STAFF)return $('#v').innerHTML='<div class=card><h3>Akses khusus tim Maintenance</h3><p>Akun Anda tidak memiliki peran Maintenance.</p></div>';loading();
 const r=await api({action:'staffList',username:STAFF.u,password:STAFF.p});
 if(!r.ok){$('#v').innerHTML='<div class=card>'+esc(r.error)+'</div>';return}
 R=[];for(const k in D)(r.data[D[k].sheet]||[]).forEach(o=>R.push({k,o}));R.sort((a,b)=>String(b.o['Tanggal Diajukan']).localeCompare(String(a.o['Tanggal Diajukan'])));
 $('#v').innerHTML=`<div class=bar><h2>Panel Maintenance</h2><span><button class="btn g sm" onclick="laporan()"><i class="fa-solid fa-file-lines"></i> Laporan Rekap</button> <button class="btn g sm" onclick="csv()"><i class="fa-solid fa-file-csv"></i> Export CSV</button></span></div><div id=kpi class=kpis></div><div class=card><div class=row style="flex-wrap:wrap"><input id=q placeholder="Cari no/pemohon/aset..." oninput="draw()" style="flex:1"><select id=fs onchange="draw()"><option value="">Semua Status</option><option>Diajukan</option><option>Diterima</option><option>Dijadwalkan</option><option>Diproses</option><option>Menunggu Sparepart</option><option>Direview</option><option>Disetujui</option><option>Pengadaan</option><option>Selesai</option><option>Ditolak</option></select></div><div class=sc><table id=tb></table></div></div>`;draw()}
function draw(){kpi();const q=$('#q').value.toLowerCase(),s=$('#fs').value;
 $('#tb').innerHTML='<tr><th>No</th><th>Jenis</th><th>Pemohon</th><th>Aset / Item</th><th>Prioritas</th><th>Status</th><th></th></tr>'+R.map((x,i)=>({...x,i})).filter(x=>(!s||x.o.Status==s)&&(!q||JSON.stringify(x.o).toLowerCase().includes(q))).map(x=>`<tr><td>${esc(x.o[D[x.k].id])}</td><td>${x.k}</td><td>${esc(x.o.Pemohon)}<br><span class=mut>${esc(x.o.Departemen)}</span></td><td>${esc(summ(x.o))}</td><td>${esc(x.o.Prioritas)}</td><td><span class="bd ${x.o.Status}">${esc(x.o.Status)}</span></td><td class=nw><button class="btn sm" onclick="proses(${x.i})">Proses</button> <button class="btn g sm" onclick="cetakR(${x.i})"><i class="fa-solid fa-print"></i></button></td></tr>`).join('')}
function proses(i){const {k,o}=R[i],d=D[k];
 dlg.innerHTML=`<form onsubmit="return save(event,${i})"><h3>${esc(o[d.id])} — ${esc(o.Pemohon)}</h3><p class=mut>${esc(summ(o))}: ${esc(o['Deskripsi Kerusakan']||o['Alasan/Keterangan']||o['Alasan Kebutuhan']||'')}</p>${fld({k:'Status',t:'s',r:1,o:[...FLOW[k],'Ditolak']})}${d.staff.map(fld).join('')}<div class=row><button class=btn>Simpan</button><button type=button class="btn g" onclick="dlg.close()">Batal</button></div></form>`;
 [...dlg.querySelector('form').elements].forEach(e=>{if(e.name&&o[e.name]!=null)e.value=o[e.name]});dlg.showModal()}
async function save(e,i){e.preventDefault();const {k,o}=R[i];
 const r=await api({action:'setStatus',username:STAFF.u,password:STAFF.p,sheet:D[k].sheet,id:o[D[k].id],fields:Object.fromEntries(new FormData(e.target))});
 if(!r.ok)return alert(r.error);dlg.close();staff();return false}
const DOCS={},TODAY=new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
const HEAD=t=>`<div class=ph><img src="MSB_Logo.png" alt="" onerror="this.style.display='none'"><div class=pt><b>PT MURINDA SENTRA BAJA</b><span>Departemen Maintenance</span></div><div class=pr2><b>${t}</b><span>Dicetak: ${TODAY}</span></div></div>`;
const out=h=>{$('#pr').innerHTML=h;setTimeout(()=>print(),200)};
const cetakId=id=>cetak(DOCS[id].k,DOCS[id].o,DOCS[id].log),cetakR=i=>cetak(R[i].k,R[i].o,[]);
function cetak(k,o,log){const d=D[k],F=FLOW[k],id=o[d.id],L=log.filter(l=>l['No Dokumen']==id);
 const rows=Object.keys(o).filter(x=>x!='__row'&&x!=d.id&&o[x]!==''&&o[x]!=null).map(x=>`<tr><th>${esc(x)}</th><td>${esc(o[x])}</td></tr>`).join('');
 out(`${HEAD(d.t)}<div class=pn><span>No. Dokumen: <b>${esc(id)}</b></span><span class="bd ${o.Status}">${esc(o.Status)}</span></div><table class=pk>${rows}</table><div class=st>${F.map((s,j)=>`<span class="${j<=F.indexOf(o.Status)?'d':''}">${s}</span>`).join('')}</div>${L.length?'<h4>Riwayat Status</h4><table class=pk>'+L.map(l=>`<tr><th>${esc(l.Waktu)}</th><td>${esc(l['Status Baru'])} — ${esc(l['Diubah Oleh'])}</td></tr>`).join('')+'</table>':''}<div class=sig>${['Pemohon','Atasan / Kepala Dept.','Maintenance','Disetujui'].map(s=>`<div>${s}<i></i></div>`).join('')}</div>`)}
const open_=x=>!['Selesai','Ditolak'].includes(x.o.Status);
function flt(){const q=($('#q')||{value:''}).value.toLowerCase(),s=($('#fs')||{value:''}).value;return R.filter(x=>(!s||x.o.Status==s)&&(!q||JSON.stringify(x.o).toLowerCase().includes(q)))}
const kpiH=a=>[['Total Permintaan',a.length,'fa-inbox'],['Sedang Berjalan',a.filter(open_).length,'fa-gears'],['Selesai',a.filter(x=>x.o.Status=='Selesai').length,'fa-circle-check'],['Darurat Terbuka',a.filter(x=>open_(x)&&x.o.Prioritas=='Darurat').length,'fa-triangle-exclamation']].map(x=>`<div class=kp><i class="fa-solid ${x[2]}"></i><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
const kpi=()=>{$('#kpi').innerHTML=kpiH(R)};
function laporan(){const a=flt();
 const per=Object.keys(D).map(k=>{const b=a.filter(x=>x.k==k);return `<tr><td>${D[k].t}</td><td>${b.length}</td><td>${b.filter(open_).length}</td><td>${b.filter(x=>x.o.Status=='Selesai').length}</td><td>${b.filter(x=>x.o.Status=='Ditolak').length}</td></tr>`}).join('');
 out(`${HEAD('Laporan Rekap Permintaan Maintenance')}<div class=kpis>${kpiH(a)}</div><h4>Ringkasan per Jenis Dokumen</h4><table class=pt2><tr><th>Jenis Dokumen</th><th>Total</th><th>Berjalan</th><th>Selesai</th><th>Ditolak</th></tr>${per}</table><h4>Rincian Permintaan</h4><table class=pt2><tr><th>No Dokumen</th><th>Tanggal</th><th>Pemohon</th><th>Dept.</th><th>Aset / Item</th><th>Prioritas</th><th>Status</th></tr>${a.map(x=>`<tr><td>${esc(x.o[D[x.k].id])}</td><td>${esc(x.o['Tanggal Diajukan'])}</td><td>${esc(x.o.Pemohon)}</td><td>${esc(x.o.Departemen)}</td><td>${esc(summ(x.o))}</td><td>${esc(x.o.Prioritas)}</td><td>${esc(x.o.Status)}</td></tr>`).join('')}</table>`)}
function csv(){const h=['No Dokumen','Jenis','Tanggal','Pemohon','Departemen','Aset / Item','Prioritas','Status','Teknisi/Penyetuju','Tanggal Selesai'];
 const t=[h,...flt().map(x=>[x.o[D[x.k].id],D[x.k].t,x.o['Tanggal Diajukan'],x.o.Pemohon,x.o.Departemen,summ(x.o),x.o.Prioritas,x.o.Status,x.o['Teknisi Ditugaskan']||x.o['Teknisi/Vendor']||x.o['Disetujui Oleh']||'',x.o['Tanggal Selesai']||''])].map(l=>l.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');
 Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'})),download:'Rekap_Maintenance.csv'}).click()}
window.onhashchange=route;
(async()=>{if(AU){loading();try{const r=await api({action:'portalLogin',tipe:AU.tipe,username:AU.Username,password:AU.p});if(!r.ok)throw r.error;DB.aset=r.aset;aset()}catch(x){AU=ME=STAFF=null;sessionStorage.clear()}}route()})();
